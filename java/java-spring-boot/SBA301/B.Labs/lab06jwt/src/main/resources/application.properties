spring.application.name=lab06-jwt
server.port=8005

# --- SQL Server ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OrchidJWTLab;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# JWT_SECRET phai la chuoi Base64 (>= 32 bytes). Gia tri mac dinh chi dung cho lab, KHONG dung o production.
security.jwt.secret-key=${JWT_SECRET:c2JhMzAxLWxhYjA2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtMDEyMzQ1Njc4OWFiY2RlZg==}
security.jwt.expiration-time=3600000
