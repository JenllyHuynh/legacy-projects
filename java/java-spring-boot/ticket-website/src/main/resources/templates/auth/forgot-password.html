<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Forgot Password - EventGo</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1f62ff",
                        "primary-hover": "#1a4fcc",
                        "background-light": "#f5f6f8",
                        "background-dark": "#0f1523",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a202c",
                        "border-light": "#e2e8f0",
                        "border-dark": "#2d3748",
                        "text-main": "#0c111d",
                        "text-sub": "#4560a1",
                        "success": "#10b981",
                        "danger": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div th:replace="~{fragment/frag::loading}" ></div>
<script th:replace="~{fragment/frag::scriptLoading}" ></script>
<!-- Header / Nav -->
<header class="w-full border-b border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-6 py-4">
    <div class="max-w-[960px] mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/home'">
            <div class="text-primary">
                <span class="material-symbols-outlined text-3xl">event</span>
            </div>
            <h2 class="text-text-main dark:text-white text-xl font-bold tracking-tight">EventGo</h2>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-[480px] flex flex-col">
        <!-- Card -->
        <div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-lg overflow-hidden border border-border-light dark:border-border-dark">
            <!-- Hero / Visual Area -->
            <div class="relative h-40 w-full bg-gradient-to-br from-primary/5 to-primary/10 flex items-center justify-center overflow-hidden">
                <div class="bg-primary/10 dark:bg-primary/20 p-5 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary text-4xl">lock_reset</span>
                </div>
            </div>

            <div class="p-8">
                <!-- Headings -->
                <div class="mb-6 text-center">
                    <h1 class="text-2xl font-bold text-text-main dark:text-white mb-2">Forgot Password?</h1>
                    <p class="text-text-sub dark:text-slate-400 text-sm leading-relaxed">
                        Enter your email to receive OTP verification
                    </p>
                </div>

                <!-- Current Login Info (if logged in) - THÊM MỚI -->
                <div th:if="${currentEmail}"
                     class="mb-4 p-3 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-blue-600 dark:text-blue-400 text-sm flex items-start gap-2">
                    <span class="material-symbols-outlined text-lg flex-shrink-0 mt-0.5">info</span>
                    <span>You are currently logged in as <strong th:text="${currentEmail}"></strong>. Password reset will be sent to this email.</span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}"
                     class="mb-4 p-3 rounded-lg bg-danger/10 border border-danger/20 text-danger text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">error</span>
                    <span th:text="${error}">Error message</span>
                </div>

                <!-- Success Message (nếu có) -->
                <div th:if="${success}"
                     class="mb-4 p-3 rounded-lg bg-success/10 border border-success/20 text-success text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">check_circle</span>
                    <span th:text="${success}">Success message</span>
                </div>

                <!-- Form -->
                <form th:action="@{/auth/forgot-password}" method="POST" class="flex flex-col gap-6" id="emailForm">
                    <!-- Email Input -->
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-semibold text-text-main dark:text-slate-300" for="email">
                            Email Address
                        </label>
                        <div class="relative flex items-center">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-sub/60">
                                <span class="material-symbols-outlined text-xl">mail</span>
                            </div>
                            <input class="w-full pl-11 pr-4 py-3.5 bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark rounded-lg text-text-main dark:text-white placeholder:text-text-sub/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                                   id="email"
                                   name="email"
                                   placeholder="example@email.com"
                                   required=""
                                   type="email"
                                   th:value="${currentEmail ?: email}"/> <!-- Ưu tiên currentEmail nếu có -->
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm shadow-primary/20 group"
                            type="submit">
                        <span>Send OTP</span>
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </form>

                <!-- Back to Login -->
                <div class="mt-8 text-center">
                    <a class="inline-flex items-center gap-1 text-sm font-medium text-text-sub dark:text-slate-400 hover:text-primary transition-colors group"
                       th:href="@{/auth/login}">
                        <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                        Back to Login
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer links -->
        <div class="mt-8 flex justify-center gap-6 text-xs text-text-sub/60 dark:text-slate-600">
            <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
            <a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
            <a class="hover:text-primary transition-colors" href="#">Contact Support</a>
        </div>
    </div>
</main>

<script>
    // Form validation
    document.getElementById('emailForm')?.addEventListener('submit', function(e) {
        const email = document.getElementById('email').value;
        if (!email || !email.includes('@') || !email.includes('.')) {
            e.preventDefault();
            alert('Please enter a valid email address');
        }
    });

    // Dark mode setup
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                if (e.matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        });
    })();
</script>
</body>
</html>
