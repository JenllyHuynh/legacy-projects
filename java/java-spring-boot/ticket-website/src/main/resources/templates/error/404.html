        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2a66f4",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101522",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]

                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                },

        }
    </script>

        class="bg-background-light dark:bg-background-dark text-[#0d111c] dark:text-white font-display min-h-screen flex flex-col">

<!-- Main Content -->
<main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-2xl flex flex-col items-center text-center">
        <!-- Icon/Illustration -->
        <div
                class="relative mb-8 p-8 rounded-full bg-white dark:bg-[#1a2030] shadow-sm ring-1 ring-black/5 dark:ring-white/5">
                <span
                        class="material-symbols-outlined text-primary text-[64px] md:text-[80px]">headphones_battery</span>
            <!-- Decorative element for "tangled cord" effect -->
            <svg class="absolute -bottom-2 -right-4 w-12 h-12 text-primary/40 animate-pulse" fill="none"
                 stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                <path d="M4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12M12 4C7.58172 4 4 7.58172 4 12"
                      stroke-dasharray="4 4" stroke-linecap="round"></path>
            </svg>
        </div>
        <!-- Typography -->
        <h1
                class="text-8xl md:text-9xl font-extrabold text-[#0d111c] dark:text-white tracking-tighter mb-4 opacity-10">
            404</h1>
        <div class="relative -mt-12 md:-mt-16 z-10 space-y-3">
            <h2 class="text-2xl md:text-3xl font-bold text-[#0d111c] dark:text-white">Page Not Found</h2>
            <p class="text-base text-gray-500 dark:text-gray-400 max-w-md mx-auto leading-relaxed">
                It seems like this stage is empty. The event you are looking for might have ended or the link is
                broken.
            </p>
        </div>
        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-4 mt-10 w-full justify-center">
            <a th:href="@{/}"
               class="flex min-w-[200px] h-12 items-center justify-center rounded-lg bg-primary text-white text-sm font-bold hover:bg-blue-600 transition-colors shadow-md hover:shadow-lg">
                Go Back to Homepage
            </a>
            <button
                    onclick="history.back()"
                    class="flex min-w-[200px] h-12 items-center justify-center rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent text-[#0d111c] dark:text-white text-sm font-bold hover:bg-gray-50 dark:hover:bg-[#1a2030] transition-colors">
                Back to previous page
            </button>
        </div>
    </div>
</main>
<!-- Footer -->
<footer class="w-full py-8 border-t border-[#e7ebf4] dark:border-[#2a2f3d] mt-auto">
    <div
            class="max-w-[1200px] mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">

        <div class="flex items-center gap-6">
            <a class="text-gray-500 dark:text-gray-400 hover:text-primary text-sm font-medium transition-colors"
               href="#">Contact Support</a>
            <a class="text-gray-500 dark:text-gray-400 hover:text-primary text-sm font-medium transition-colors"
               href="#">Privacy</a>
        </div>
    </div>
</footer>
