<!DOCTYPE html>
<html class="light" lang="en">
<head th:replace="~{fragment/frag::head('Edit Venue')}"></head>
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Edit Venue - EventStaff Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2464f9",
                        "background-light": "#f5f6f8",
                        "background-dark": "#0f1523",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a202c",
                        "text-main": "#0d111c",
                        "text-secondary": "#47619e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display overflow-hidden">
<div th:replace="~{fragment/frag::loading}" ></div>
<script th:replace="~{fragment/frag::scriptLoading}" ></script>
<div class="flex h-screen w-full">
    <aside th:replace="~{fragment/staff/frag::staffSidebar('venue')}"></aside>
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark">
        <header class="bg-surface-light dark:bg-surface-dark border-b border-[#e6eaf4] dark:border-gray-700 px-6 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <button class="lg:hidden text-text-secondary dark:text-gray-400">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="flex flex-col">
                    <h1 class="font-bold text-lg text-text-main dark:text-white">Edit Venue</h1>
                    <nav class="flex text-[10px] text-text-secondary dark:text-gray-400 gap-1 items-center uppercase font-bold tracking-wider">
                        <span>Management</span>
                        <span class="material-symbols-outlined text-[12px]">chevron_right</span>
                        <span>Venues</span>
                        <span class="material-symbols-outlined text-[12px]">chevron_right</span>
                        <span class="text-primary">Update Venue</span>
                    </nav>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-text-secondary dark:text-gray-400 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
                <div class="bg-center bg-no-repeat bg-cover rounded-full size-8" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBxGnBN0wUNMcZfjCvUCV-xgjiOoMV5-CZ-XGHmAS8-29ufKR6vXZHsHftjoTTCHhzeJvkgFEHWTA3mYu0jD3kXIlXW5pMfNbQSjFMhYLF6MjG8Wc8EiWy0g658JhTGZmEkA4q-4EOxExTtI5gOtjGGcUVYJ8epRcvRLZFqRsqDJUHsz4MGlPa08QnhgnR8thgMUyQ0F0Y88iAjuoB6LV0-vueKEM_A0FUCzVXrGOtyd7CXJcNTKlMF8dg62NOyW_6AzbClpcW397xm");'></div>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
            <div class="max-w-4xl mx-auto">
                <form class="space-y-6" th:action="@{/staff/venue/save}"  th:object="${venue}" method="post">
                    <input th:field="*{id}" type="hidden"/>
                    <input th:field="*{createdAt}" type="hidden"/>
                    <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-[#e6eaf4] dark:border-gray-700 shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b border-[#e6eaf4] dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/30">
                            <h3 class="font-bold text-text-main dark:text-white flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-[20px]">info</span>
                                Basic Information
                            </h3>
                        </div>
                        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-text-main dark:text-gray-300">Venue Name</label>
                                <input th:field="*{name}" th:value="*{name}" th:id="venueName" required class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary" placeholder="e.g. Grand Central Hall" type="text"/>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-text-main dark:text-gray-300">Capacity</label>
                                <input th:field="*{capacity}" th:min="30" required class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary" placeholder="Enter maximum occupancy" type="number"/>
                            </div>
                        </div>
                    </div>
                    <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-[#e6eaf4] dark:border-gray-700 shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b border-[#e6eaf4] dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/30">
                            <h3 class="font-bold text-text-main dark:text-white flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-[20px]">location_on</span>
                                Address Details
                            </h3>
                        </div>
                        <div class="p-6 space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-text-main dark:text-gray-300">Country</label>
                                    <select th:field="*{country}" required id="country" class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary">
                                        <option value="Việt Nam" selected>Việt Nam</option>
                                    </select>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-text-main dark:text-gray-300">City / Province</label>
                                    <select th:field="*{city}" required id="province" class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary">
                                        <option th:attr="value=${pathVaribleProvince}" id="provinceCode" selected th:text="*{city}"></option>
                                    </select>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-text-main dark:text-gray-300">Ward</label>
                                    <select th:field="*{ward}" id="ward" required  class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary">
                                        <option th:attr="value=${pathVaribleWard}" id="wardCode" selected th:text="*{ward}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-semibold text-text-main dark:text-gray-300">Street Address</label>
                                <input th:field="*{street}" required class="w-full bg-white dark:bg-gray-800 border-[#e6eaf4] dark:border-gray-700 rounded-lg text-sm focus:ring-primary focus:border-primary" placeholder="e.g. 123 Event Lane" type="text"/>
                                <input th:feild="*{lat}" th:value="*{lat}" name="lat" required id="lat" type="hidden">
                                <input th:feild="*{lon}" th:value="*{lon}" name="lon" required id="lon" type="hidden">
                            </div>
                        </div>
                    </div>

                    <div class="bg-surface-light dark:bg-surface-dark rounded-xl border border-[#e6eaf4] dark:border-gray-700 shadow-sm overflow-hidden">
                        <div class="p-6 flex items-center justify-between">
                            <div class="flex flex-col gap-1">
                                <h3 class="font-bold text-text-main dark:text-white">Active Status</h3>
                                <p class="text-xs text-text-secondary dark:text-gray-400">Mark this venue as available for new event bookings.</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input th:field="*{isActive}" class="sr-only peer" type="checkbox"/>
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
                            </label>
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-3 pt-4">
                        <button th:onclick="|location.href='/staff/venue'|" class="px-6 py-2.5 rounded-lg text-sm font-bold text-text-secondary dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" type="button">
                            Cancel
                        </button>
                        <button class="px-8 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition-all shadow-md shadow-blue-200 dark:shadow-none" type="submit">
                            Update Venue
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<!--Map-->
<script>


</script>
<script>


    async function loadProvinces() {
      try {
          const respone = await fetch('/api/address/p');
          const provinces = await respone.json();

          let provinceSelect = document.getElementById("province");


          provinces.forEach(province => {
            let option = document.createElement("option");
            option.value = province.code;
            option.text = province.name;
            provinceSelect.appendChild(option);
          });
      } catch (error) {
           console.error("loading province fail", error);
      }
   }

   async function loadWardsTheFirstTime(code) {
      try {
          const respone = await fetch('/api/address/p/' + code);
          const wards = await respone.json();
          const wardSelected = document.getElementById("wardCode")
          console.log(wardSelected.text);

          let wardSelect = document.getElementById("ward");
          wardSelect.disabled = false;

          wards.forEach(ward => {
            let option = document.createElement("option");
            option.value = ward.code;
            option.text = ward.name;
            if (ward.name != wardSelected.text) {
                wardSelect.appendChild(option);
            }
          });
      } catch (error) {
              console.error("loading ward fail", error);
      }
   }

   async function loadWards(code) {
      try {
          const respone = await fetch('/api/address/p/' + code);
          const wards = await respone.json();

          let wardSelect = document.getElementById("ward");
          wardSelect.innerHTML = '<option value="" selected hidden></option>';
          wardSelect.disabled = false;

          wards.forEach(ward => {
            let option = document.createElement("option");
            option.value = ward.code;
            option.text = ward.name;
            wardSelect.appendChild(option);
          });
      } catch (error) {
              console.error("loading ward fail", error);
      }
   }

  document.addEventListener('DOMContentLoaded', async function() {

          loadProvinces();

          const provinceOption = document.getElementById("provinceCode");
          console.log(provinceOption.value);
          const respone2 = await fetch('/api/address/p/findCode/' + provinceOption.value);
          const provinceCode = await respone2.json();
          loadWardsTheFirstTime(provinceCode.code);



          const provinceSelect = document.getElementById("province");
          const wardSelect = document.getElementById("ward");

          provinceSelect.addEventListener('change', function() {
              if (this.value) {
                  loadWards(this.value);
                  wardSelect.innerHTML = '<option value="" selected hidden></option>';
              } else {
                  document.getElementById("ward").disabled = true;
              }
          });


  });
</script>

</body></html>
