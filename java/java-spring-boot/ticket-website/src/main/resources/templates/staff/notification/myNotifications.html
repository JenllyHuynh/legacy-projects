<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/frag::head('My Notifications')}"></head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white flex overflow-hidden h-screen">
<div th:replace="~{fragment/frag::loading}"></div>
<script th:replace="~{fragment/frag::scriptLoading}"></script>
<aside th:replace="~{fragment/staff/frag::staffSidebar('notification')}"></aside>

<div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header th:replace="~{fragment/staff/frag::header('My Notifications')}"></header>

    <main class="flex-1">
        <div class="max-w-3xl mx-auto p-8">

            <!-- Page Header -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 dark:bg-blue-900/30 shrink-0">
                        <span class="material-symbols-outlined text-blue-600 dark:text-blue-400 text-[24px]">notifications</span>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">My Notifications</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">
                            Notifications from the event team
                        </p>
                    </div>
                </div>
                <button id="markAllBtn"
                        class="flex items-center gap-2 h-9 px-4 rounded-lg border border-slate-200 dark:border-slate-700
                               text-sm font-semibold text-slate-600 dark:text-slate-300
                               hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-[16px]">done_all</span>
                    Mark all read
                </button>
            </div>

            <!-- Filter tabs -->
            <div class="flex gap-2 mb-6">
                <button data-filter="all"
                        class="filter-tab h-8 px-4 rounded-full text-xs font-bold bg-primary text-white transition-colors">
                    All
                </button>
                <button data-filter="unread"
                        class="filter-tab h-8 px-4 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors">
                    Unread
                </button>
                <button data-filter="InApp"
                        class="filter-tab h-8 px-4 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors">
                    In-App
                </button>
                <button data-filter="Email"
                        class="filter-tab h-8 px-4 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors">
                    Email
                </button>
            </div>

            <!-- Notification list -->
            <div id="notifContainer"
                 class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm overflow-hidden">
                <!-- Loading -->
                <div id="loadingState" class="flex items-center justify-center py-16 gap-2 text-slate-400">
                    <span class="material-symbols-outlined text-[28px]">hourglass_empty</span>
                    <span class="text-sm font-medium">Loading notifications...</span>
                </div>
                <!-- Empty -->
                <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-slate-400">
                    <span class="material-symbols-outlined text-[48px] mb-3">notifications_none</span>
                    <p class="text-base font-semibold">No notifications</p>
                    <p class="text-sm mt-1">You're all caught up!</p>
                </div>
                <!-- Items rendered by JS -->
                <div id="notifList" class="divide-y divide-slate-50 dark:divide-slate-800"></div>
            </div>

        </div>
    </main>
</div>

<script>
    // ── State ─────────────────────────────────────────────────────────
    let allNotifications = [];
    let currentFilter    = 'all';

    // ── Helpers ───────────────────────────────────────────────────────
    function formatTime(isoStr) {
        if (!isoStr) return '';
        const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
        if (diff < 60)    return 'Just now';
        if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
        return new Date(isoStr).toLocaleDateString('vi-VN');
    }

    function esc(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function getTypeInfo(type) {
        if (type === 'Email') return {
            icon: 'mail', bg: 'bg-amber-100 dark:bg-amber-900/30',
            color: 'text-amber-500', label: 'Email', labelCls: 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'
        };
        return {
            icon: 'notifications', bg: 'bg-blue-100 dark:bg-blue-900/30',
            color: 'text-blue-500', label: 'In-App', labelCls: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'
        };
    }

    function renderItem(n) {
        const { icon, bg, color, label, labelCls } = getTypeInfo(n.notificationType);
        const unread = !n.isRead;
        return `
            <div class="flex items-start gap-4 px-6 py-4 cursor-pointer
                        hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors
                        ${unread ? 'bg-blue-50/50 dark:bg-blue-900/10' : ''}"
                 data-id="${n.id}"
                 data-type="${esc(n.notificationType)}"
                 data-unread="${unread}"
                 onclick="markRead(${n.id}, this)">

                <!-- Icon -->
                <div class="flex h-10 w-10 items-center justify-center rounded-full ${bg} shrink-0 mt-0.5">
                    <span class="material-symbols-outlined ${color} text-[20px]">${icon}</span>
                </div>

                <!-- Content -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-3">
                        <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">
                            ${esc(n.title)}
                        </p>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[10px] text-slate-400 whitespace-nowrap">${formatTime(n.sentAt)}</span>
                            ${unread ? '<span class="h-2 w-2 rounded-full bg-blue-500 shrink-0 unread-dot"></span>' : ''}
                        </div>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                        ${esc(n.message)}
                    </p>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${labelCls}">
                            ${label}
                        </span>
                        ${n.eventTitle ? `<span class="text-[11px] text-primary font-medium">· ${esc(n.eventTitle)}</span>` : ''}
                        ${n.senderName ? `<span class="text-[11px] text-slate-400">· From: ${esc(n.senderName)}</span>` : ''}
                    </div>
                </div>
            </div>`;
    }

    // ── Load tất cả thông báo ─────────────────────────────────────────
    async function loadAll() {
        try {
            const res = await fetch('/api/staff/notifications/all');
            if (!res.ok) throw new Error();
            allNotifications = await res.json();
            renderFiltered();
        } catch (_) {
            document.getElementById('loadingState').innerHTML =
                `<p class="text-sm text-slate-400 text-center py-8">Unable to load notifications.</p>`;
        }
    }

    // ── Render theo filter hiện tại ───────────────────────────────────
    function renderFiltered() {
        const loading = document.getElementById('loadingState');
        const empty   = document.getElementById('emptyState');
        const list    = document.getElementById('notifList');

        loading.classList.add('hidden');

        let filtered = allNotifications;
        if (currentFilter === 'unread')       filtered = allNotifications.filter(n => !n.isRead);
        else if (currentFilter !== 'all')     filtered = allNotifications.filter(n => n.notificationType === currentFilter);

        if (filtered.length === 0) {
            empty.classList.remove('hidden');
            list.innerHTML = '';
        } else {
            empty.classList.add('hidden');
            list.innerHTML = filtered.map(renderItem).join('');
        }
    }

    // ── Đánh dấu 1 đã đọc ────────────────────────────────────────────
    window.markRead = async function(id, el) {
        if (el.getAttribute('data-unread') !== 'true') return;
        try {
            const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const headers    = {};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            await fetch(`/api/staff/notifications/${id}/read`, { method: 'PUT', headers });

            el.setAttribute('data-unread', 'false');
            el.classList.remove('bg-blue-50/50', 'dark:bg-blue-900/10');
            el.querySelector('.unread-dot')?.remove();

            // Cập nhật local state
            const n = allNotifications.find(x => x.id === id);
            if (n) n.isRead = true;

            // Update badge trên chuông
            const badge = document.getElementById('staffNotifBadge');
            if (badge && badge.style.display !== 'none') {
                const cur = parseInt(badge.textContent) || 1;
                if (cur <= 1) badge.style.display = 'none';
                else badge.textContent = cur - 1;
            }
        } catch (_) {}
    };

    // ── Mark all read ─────────────────────────────────────────────────
    document.getElementById('markAllBtn')?.addEventListener('click', async function () {
        try {
            const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const headers    = {};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            await fetch('/api/staff/notifications/read-all', { method: 'PUT', headers });

            allNotifications.forEach(n => n.isRead = true);
            renderFiltered();

            const badge = document.getElementById('staffNotifBadge');
            if (badge) badge.style.display = 'none';
        } catch (_) {}
    });

    // ── Filter tabs ───────────────────────────────────────────────────
    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', function () {
            currentFilter = this.getAttribute('data-filter');

            // Update tab styles
            document.querySelectorAll('.filter-tab').forEach(b => {
                b.classList.remove('bg-primary', 'text-white');
                b.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
            });
            this.classList.add('bg-primary', 'text-white');
            this.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');

            renderFiltered();
        });
    });

    // ── Init ──────────────────────────────────────────────────────────
    loadAll();
</script>

<!-- Script chuông -->
<th:block th:replace="~{fragment/staff/frag::staffBellScript}"></th:block>
</body>
</html>
