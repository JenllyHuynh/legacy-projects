<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragment/frag::loading}" ></div>
<script th:replace="~{fragment/frag::scriptLoading}" ></script>
<div class="container mt-5">
    <h1>Events List</h1>
    <p class="text-muted">Select an event to manage its ticket types</p>

    <div class="row mt-4">
        <div th:each="event : ${events}" class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${event.title}"></h5>
                    <p class="card-text" th:text="${event.description}"></p>
                    <p class="card-text">
                        <small class="text-muted">
                            Event ID: <span th:text="${event.id}"></span> |
                            Status: <span th:text="${event.eventStatus}"></span>
                        </small>
                    </p>
                    <a th:href="@{/staff/event/{eventId}/ticket-types(eventId=${event.id})}"
                       class="btn btn-primary btn-sm">
                        Manage Ticket Types
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Nếu không có events -->
    <div th:if="${#lists.isEmpty(events)}" class="alert alert-warning mt-4">
        No events found. Please create an event first.
    </div>
</div>
</body>
</html>
