<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragment/frag::head('Create Ticket Type')"></head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden">
<div th:replace="~{fragment/frag::loading}" ></div>
<script th:replace="~{fragment/frag::scriptLoading}" ></script>
<div class="flex h-screen w-full">
    <!-- Sidebar -->
    <aside th:replace="~{fragment/staff/frag::staffSidebar('eventList')}"></aside>

    <!-- Main Content Wrapper -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-background-light dark:bg-background-dark">
        <!-- Top Navbar -->
        <div th:insert="~{fragment/staff/frag::header(title='Create Ticket Type')}"></div>

        <div class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 lg:px-12 lg:py-10">
            <div class="max-w-5xl mx-auto flex flex-col gap-8">
                <!-- Error Messages (Outside Form) -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                    <span th:text="${error}"></span>
                </div>

                <!-- Main Form -->
                <form th:action="@{/staff/event/{eventId}/ticket-types(eventId=${ticketType.eventId})}"
                      th:object="${ticketType}"
                      method="post"
                      id="ticketTypeForm"
                      class="bg-white dark:bg-[#1a202c] rounded-xl shadow-sm border border-[#e7ebf3] dark:border-gray-800 overflow-hidden">

                    <input type="hidden" th:field="*{eventId}" />

                    <!-- Validation Error Messages (Inside Form) -->
                    <div th:if="${#fields.hasErrors('*')}" class="mx-6 md:mx-8 mt-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <p class="font-semibold mb-2">Please fix the following errors:</p>
                        <ul class="list-disc list-inside space-y-1">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <div class="p-6 md:p-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                            <!-- Column 1 -->
                            <div class="flex flex-col gap-6">
                                <!-- Ticket Type Name -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Ticket Type Name *
                                    </label>
                                    <input th:field="*{name}"
                                           id="ticketName"
                                           th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''"
                                           class="w-full h-12 px-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                           placeholder="e.g. VIP Admission"
                                           oninput="validateName(this)" />
                                    <span th:if="${#fields.hasErrors('name')}"
                                          th:errors="*{name}"
                                          class="text-red-500 text-sm mt-1"></span>
                                    <span id="nameError" class="text-red-500 text-sm mt-1 hidden"></span>
                                </div>

                                <!-- Price -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Price *
                                    </label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 flex items-center pointer-events-none">
                                            <span class="text-[#4c639a] font-medium"></span>
                                        </div>
                                        <input th:field="*{price}"
                                               id="ticketPrice"
                                               type="number"
                                               step="0.01"
                                               min="0.01"
                                               th:classappend="${#fields.hasErrors('price')} ? 'border-red-500' : ''"
                                               class="w-full h-12 pl-4 pr-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                               placeholder="0.00"
                                               oninput="validatePrice(this)" />
                                        <span th:if="${#fields.hasErrors('price')}"
                                              th:errors="*{price}"
                                              class="text-red-500 text-sm mt-1"></span>
                                        <span id="priceError" class="text-red-500 text-sm mt-1 hidden"></span>
                                    </div>
                                </div>

                                <!-- Sales Start Date -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Sales Start Date *
                                    </label>
                                    <div class="relative">
                                        <input th:field="*{salesStartDate}"
                                               id="salesStartDate"
                                               type="datetime-local"
                                               th:classappend="${#fields.hasErrors('salesStartDate')} ? 'border-red-500' : ''"
                                               class="w-full h-12 px-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                               onchange="validateDates()" />
                                        <span th:if="${#fields.hasErrors('salesStartDate')}"
                                              th:errors="*{salesStartDate}"
                                              class="text-red-500 text-sm mt-1"></span>
                                        <span id="startDateError" class="text-red-500 text-sm mt-1 hidden"></span>
                                    </div>
                                    <!-- Hint: cho phép ngày quá khứ -->
                                    <p class="text-xs text-slate-400">You may set a past date (e.g. if event was created earlier)</p>
                                </div>

                                <!-- Max Tickets Per User -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Max Tickets Per User *
                                    </label>
                                    <input th:field="*{maxTicketsPerUser}"
                                           type="number"
                                           min="1"
                                           max="100"
                                           class="w-full h-12 px-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                           placeholder="Default: 5" />
                                </div>
                            </div>

                            <!-- Column 2 -->
                            <div class="flex flex-col gap-6">
                                <!-- Description -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Description
                                    </label>
                                    <textarea th:field="*{description}"
                                              maxlength="500"
                                              class="w-full p-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none resize-none"
                                              placeholder="Enter ticket benefits, restrictions, and other details..."
                                              rows="5"></textarea>
                                    <span class="text-xs text-slate-500">Maximum 500 characters</span>
                                </div>

                                <!-- Total Quantity -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Total Quantity *
                                    </label>
                                    <input th:field="*{quantity}"
                                           type="number"
                                           min="1"
                                           max="1000000"
                                           th:classappend="${#fields.hasErrors('quantity')} ? 'border-red-500' : ''"
                                           class="w-full h-12 px-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                           placeholder="e.g. 100" />
                                    <span th:if="${#fields.hasErrors('quantity')}"
                                          th:errors="*{quantity}"
                                          class="text-red-500 text-sm mt-1"></span>
                                </div>

                                <!-- Sales End Date -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Sales End Date *
                                    </label>
                                    <div class="relative">
                                        <input th:field="*{salesEndDate}"
                                               id="salesEndDate"
                                               type="datetime-local"
                                               th:classappend="${#fields.hasErrors('salesEndDate')} ? 'border-red-500' : ''"
                                               class="w-full h-12 px-4 rounded-lg bg-white dark:bg-gray-800 border border-[#cfd6e7] dark:border-gray-600 text-[#0d121b] dark:text-white placeholder:text-[#9ca3af] focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
                                               onchange="validateDates()" />
                                        <span th:if="${#fields.hasErrors('salesEndDate')}"
                                              th:errors="*{salesEndDate}"
                                              class="text-red-500 text-sm mt-1"></span>
                                        <span id="endDateError" class="text-red-500 text-sm mt-1 hidden"></span>
                                    </div>
                                    <!-- Hint: deadline phải trước event start -->
                                    <p class="text-xs text-slate-400"
                                       th:text="'Must be before event starts: ' + ${#temporals.format(eventStartDateTime, 'MMM dd, yyyy HH:mm')}">
                                        Must be before event starts
                                    </p>
                                </div>

                                <!-- Active Status -->
                                <div class="flex flex-col gap-2">
                                    <label class="text-sm font-medium text-[#0d121b] dark:text-slate-200">
                                        Status
                                    </label>
                                    <div class="flex items-center gap-4">
                                        <label class="flex items-center gap-2">
                                            <input th:field="*{active}" type="radio" th:value="true" class="text-primary" checked />
                                            <span class="text-sm">Active</span>
                                        </label>
                                        <label class="flex items-center gap-2">
                                            <input th:field="*{active}" type="radio" th:value="false" class="text-primary" />
                                            <span class="text-sm">Inactive</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="px-6 md:px-8 py-4 bg-gray-50 dark:bg-gray-900/50 border-t border-[#e7ebf3] dark:border-gray-800 flex items-center justify-end gap-4">
                        <a th:href="@{/staff/event/{eventId}/ticket-types(eventId=${ticketType.eventId})}"
                           class="px-6 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-[#0d121b] dark:text-white font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-700 outline-none">
                            Cancel
                        </a>
                        <button type="submit"
                                class="px-6 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-blue-700 transition-colors shadow-sm shadow-blue-200 dark:shadow-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 outline-none">
                            Create Ticket Type
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:inline="javascript">
    // Lấy eventStartDateTime từ Thymeleaf - dùng th:inline="javascript" để inject an toàn
    const eventStartDateTime = new Date([[${eventStartDateTime}]]);
    const eventEndDateTime   = new Date([[${eventEndDateTime}]]);

    console.log('Event Start:', eventStartDateTime);
    console.log('Event End:',   eventEndDateTime);

    function validateName(input) {
        const value = input.value.trim();
        const errorSpan = document.getElementById('nameError');
        input.classList.remove('border-red-500');
        errorSpan.classList.add('hidden');

        if (!value) {
            input.classList.add('border-red-500');
            errorSpan.textContent = 'Ticket name is required';
            errorSpan.classList.remove('hidden');
            return false;
        }
        if (!/[a-zA-Z]/.test(value)) {
            input.classList.add('border-red-500');
            errorSpan.textContent = 'Ticket name must contain at least one letter';
            errorSpan.classList.remove('hidden');
            return false;
        }
        if (value.length < 2 || value.length > 100) {
            input.classList.add('border-red-500');
            errorSpan.textContent = 'Ticket name must be between 2 and 100 characters';
            errorSpan.classList.remove('hidden');
            return false;
        }
        return true;
    }

    function validatePrice(input) {
        const value = parseFloat(input.value);
        const errorSpan = document.getElementById('priceError');
        input.classList.remove('border-red-500');
        errorSpan.classList.add('hidden');

        if (isNaN(value) || value <= 0) {
            input.classList.add('border-red-500');
            errorSpan.textContent = 'Price must be greater than 0';
            errorSpan.classList.remove('hidden');
            return false;
        }
        return true;
    }

    /**
     * Validate Dates — CREATE MODE
     *
     * LOGIC MỚI (đã sửa bug):
     * - KHÔNG chặn ngày quá khứ tuyệt đối nữa
     *   Lý do: staff tạo vé cho event đã tạo từ trước, salesStart hợp lệ ngay cả khi < now
     * - CHỈ check:
     *   1. salesEndDate phải TRƯỚC eventStartDateTime
     *   2. salesEndDate phải SAU salesStartDate ít nhất 1 giờ
     */
    function validateDates() {
        const startDateInput = document.getElementById('salesStartDate');
        const endDateInput   = document.getElementById('salesEndDate');
        const startDateError = document.getElementById('startDateError');
        const endDateError   = document.getElementById('endDateError');

        // Reset errors
        startDateInput.classList.remove('border-red-500');
        endDateInput.classList.remove('border-red-500');
        startDateError.classList.add('hidden');
        endDateError.classList.add('hidden');

        const startDate = startDateInput.value ? new Date(startDateInput.value) : null;
        const endDate   = endDateInput.value   ? new Date(endDateInput.value)   : null;

        let hasError = false;

        // 1. Sales End Date PHẢI TRƯỚC Event Start DateTime
        if (endDate && eventStartDateTime && !isNaN(eventStartDateTime.getTime())) {
            if (endDate > eventStartDateTime) {
                endDateInput.classList.add('border-red-500');
                endDateError.textContent = `Sales must end before event starts (${formatDateTime(eventStartDateTime)})`;
                endDateError.classList.remove('hidden');
                hasError = true;
            }
        }

        // 2. End Date phải sau Start Date
        if (startDate && endDate && endDate <= startDate) {
            endDateInput.classList.add('border-red-500');
            endDateError.textContent = 'Sales end date must be after start date';
            endDateError.classList.remove('hidden');
            hasError = true;
        }

        // 3. Khoảng cách tối thiểu 1 giờ
        if (startDate && endDate) {
            const oneHour = 60 * 60 * 1000;
            if ((endDate - startDate) < oneHour) {
                endDateInput.classList.add('border-red-500');
                endDateError.textContent = 'Sales period must be at least 1 hour';
                endDateError.classList.remove('hidden');
                hasError = true;
            }
        }

        return !hasError;
    }

    function formatDateTime(date) {
        return date.toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    document.getElementById('ticketTypeForm').addEventListener('submit', function(e) {
        const isNameValid  = validateName(document.getElementById('ticketName'));
        const isPriceValid = validatePrice(document.getElementById('ticketPrice'));
        const areDatesValid = validateDates();

        if (!isNameValid || !isPriceValid || !areDatesValid) {
            e.preventDefault();
            const firstError = document.querySelector('.border-red-500');
            if (firstError) {
                firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                firstError.focus();
            }
            return false;
        }
    });
</script>

</body>
</html>
